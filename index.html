<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TODOP — Personal Task Planner</title>
    <meta name="description" content="Personal task planner with real-time countdowns" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TODOP" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('todop_app_data_v1');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.settings) {
              var theme = data.settings.theme === 'light' ? 'light' : 'dark';
              var fontSize = (data.settings.fontSize === 'small' || data.settings.fontSize === 'large')
                ? data.settings.fontSize
                : 'medium';
              document.documentElement.setAttribute('data-theme', theme);
              document.documentElement.setAttribute('data-font-size', fontSize);
              return;
            }
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-font-size', 'medium');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
